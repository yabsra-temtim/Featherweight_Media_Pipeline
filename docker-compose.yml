services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: featherweight
      POSTGRES_PASSWORD: featherweight
      POSTGRES_DB: featherweight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featherweight"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Go Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SERVER_ADDRESS: :8080
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: featherweight
      DB_PASSWORD: featherweight
      DB_NAME: featherweight
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  # ─── React Frontend (dev server) ─────────────────────────────────────────────
  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules       # anonymous volume so host modules don't override
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_MAX_UPLOAD_MB: "32"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads: