services:
  # ─── Go Backend (Web Service) ────────────────────────────────────────────────
  - type: web
    name: featherweight-api
    runtime: go
    rootDir: backend
    buildCommand: go build -o featherweight ./cmd/api
    startCommand: ./featherweight
    plan: free

    healthCheckPath: /api/v1/health

    envVars:
      - key: SERVER_ADDRESS
        value: :8080

      # ── CORS ───────────────────────────────────────────────────────────────
      # Allow requests from the Render frontend static site.
      # Must match the exact name of your static site service below.
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: featherweight-frontend
          type: static
          property: hostport    # e.g. https://featherweight-frontend.onrender.com

      # ── PostgreSQL ─────────────────────────────────────────────────────────
      # Attach a Render Postgres database, or fill these in the dashboard.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSLMODE
        value: require        # Render Postgres requires SSL

      # ── Cloudinary ─────────────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: featherweight

      # ── Workers / Limits ───────────────────────────────────────────────────
      - key: WORKER_COUNT
        value: "3"
      - key: MAX_UPLOAD_SIZE_MB
        value: "32"
      - key: FILE_RETENTION_HOURS
        value: "1"
      - key: CLEANUP_INTERVAL_MINUTES
        value: "60"
      - key: COMMAND_TIMEOUT_SECONDS
        value: "60"

  # ─── React Frontend (Static Site) ───────────────────────────────────────────
  # type: static  ← correct Render type for static sites (NOT type: web)
  - type: static
    name: featherweight-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist   # Vite always outputs to /frontend/dist

    envVars:
      # Set this to your actual backend service URL in the Render dashboard.
      # fromService hostport doesn't include https://, so we hardcode it here.
      - key: VITE_API_BASE_URL
        value: https://featherweight-media-pipeline.onrender.com
      - key: VITE_MAX_UPLOAD_MB
        value: "32"

    routes:
      # Send all paths to index.html so React Router handles /upload, /about etc.
      - type: rewrite
        source: /*
        destination: /index.html
